on:
  workflow_call:
    inputs:
      app-name:
        required: true
        type: string
      build:
        required: true
        type: string
      docker:
        required: false
        type: string
      host:
        required: true
        type: string
      if:
        description: 'Whether to run this job'
        required: false
        default: true
        type: boolean
      setup:
        required: false
        type: string
      target:
        required: true
        type: string
jobs:
  reusable-build:
    if: ${{ inputs.if }}
    name: stable - ${{ inputs.target }} - node@18
    runs-on: ${{ inputs.host }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup node
        uses: actions/setup-node@v7.1.0
        if: ${{ !inputs.docker }}
        with:
          node-version: 18
          cache: yarn
      - name: Install rust toolchain
        if: ${{ !inputs.docker }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ inputs.target }}
      - name: Cache cargo
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ inputs.target }}-cargo-${{ inputs.host }}
      - name: Install Bindgen
        run: |
          cargo install --force --locked bindgen-cli
      - name: Install zig
        uses: mlugg/setup-zig@v2.2.1
        if: ${{ inputs.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          version: 0.10.0
      - name: Setup build toolchain
        run: ${{ inputs.setup }}
        if: ${{ inputs.setup }}
        shell: bash
      - name: Install nasm
        uses: ilammy/setup-nasm@v1.5.2
        if: inputs.target == 'i686-pc-windows-msvc'
      - name: Setup node x86
        if: inputs.target == 'i686-pc-windows-msvc'
        run: yarn config set supportedArchitectures.cpu "ia32"
        shell: bash
      - name: Install js dependencies
        run: yarn install
      - name: Setup node x86
        uses: actions/setup-node@v7.1.0
        if: inputs.target == 'i686-pc-windows-msvc'
        with:
          node-version: 18
          cache: yarn
          architecture: x86
      - name: Build in docker
        if: ${{ inputs.docker}}
        env:
          IMAGE: ${{ inputs.docker }}
          NAPI_BUILD_TARGET: ${{ inputs.target }}
          NAPI_BUILD_CMD: ${{ inputs.build }}
        # The images' stable toolchain dates from when they were built (Rust
        # 1.82), too old for edition 2024 dependencies; update it first.
        run: |
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE/.cargo-cache/git/db:/usr/local/cargo/git/db" \
            -v "$GITHUB_WORKSPACE/.cargo/registry/cache:/usr/local/cargo/registry/cache" \
            -v "$GITHUB_WORKSPACE/.cargo/registry/index:/usr/local/cargo/registry/index" \
            -v "$GITHUB_WORKSPACE:/build" -w /build \
            -e NAPI_BUILD_TARGET -e NAPI_BUILD_CMD \
            --entrypoint sh "$IMAGE" -c '
              rustup update stable --no-self-update
              rustup target add "$NAPI_BUILD_TARGET"
              eval "$NAPI_BUILD_CMD"
            '
      - name: Build
        run: ${{ inputs.build }}
        if: ${{ !inputs.docker }}
      - name: Upload bindings artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bindings-${{ inputs.target }}
          path: ${{ inputs.app-name }}.*.node
          if-no-files-found: error

name: Publish

on:
  workflow_dispatch:

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    secrets:
      NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Move artifacts
        run: yarn artifacts

      - name: List packages
        run: ls -R ./npm
        shell: bash

      - name: Publish
        run: |
          # extract version from Cargo.toml
          version=$(grep '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Package version: $version"

          # npm auth
          echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> ~/.npmrc

          # check if version already exists, if not, publish it
          if npm view "@ngrok/ngrok@${version}" > /dev/null 2>&1; then
            echo "@ngrok/ngrok@${version} already exists on npm. Skipping publish."
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publishing release version $version"
            npm publish --access public
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Publishing version $version with tag 'next'"
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag Release
        run: |
          git config user.name "GitHub Action"
          git config user.email noreply@ngrok.com
          version=$(grep '^version =' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag="v$version"
          echo "Tagging release: $tag"
          echo "Fetching all tags in the repository"
          git fetch --tags
          if git rev-parse "$tag" > /dev/null 2>&1; then
            echo "Tag $tag already exists, skipping tag creation."
          else
            echo "Tag $tag does not exist, pushing tag."
            git tag -a -m "Version ${version}" $tag
            git push --tags
          fi